version: "3.4"

services:
  yolo:
    image: yolostack
    container_name: yolostack
    restart: unless-stopped
    ports:
      - "8040:8040"
    environment:
      - FORMAT=ultralytics
      - HALF=False
      - MODELNAME=yolov8x-worldv2
      - DEVICE=cuda
    build:
      context: .
      dockerfile: ./Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
